<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    `$FLUTTER_BASE_HREF` se reemplaza con el valor de `--base-href` al
    compilar (necesario si la app se publica en una subcarpeta).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Encuentra estacionamiento en el campus UDLAP en tiempo real.">

  <!-- Color de la barra del navegador / sistema -->
  <meta name="theme-color" content="#1EA270">

  <!-- iPhone: se abre como app a pantalla completa desde la pantalla de inicio -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Smart Parking">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Smart Parking</title>
  <link rel="manifest" href="manifest.json">

  <!-- Misma tipografía que la app (títulos: Marcellus; textos: Nunito) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* ------------------------------------------------------------------
       Pantalla de carga (se ve mientras Flutter arranca; Flutter la cubre
       al dibujar la app). Verde institucional, logo grande con "latido"
       (se agranda y encoge), halo suave y barra de progreso.
       ------------------------------------------------------------------ */
    html, body { margin: 0; height: 100%; background: #1EA270; }
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box;
      color: #111;
      background: radial-gradient(circle at 50% 42%, #2BB67F 0%, #1EA270 55%, #178A5E 100%);
    }
    .logo-wrap { position: relative; width: min(58vw, 250px); aspect-ratio: 1; }
    /* Halo que "respira" detrás del logo */
    .logo-wrap::before {
      content: ""; position: absolute; inset: -14%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 68%);
      animation: halo 1.6s ease-in-out infinite;
    }
    .logo {
      position: relative; width: 100%; height: 100%;
      border-radius: 22%;
      border: 3px solid #111;
      box-shadow: 0 10px 28px rgba(0,0,0,.30);
      animation: beat 1.6s ease-in-out infinite;
    }
    h1 {
      margin: 28px 0 0;
      font-family: 'Marcellus', Georgia, serif; font-weight: 400;
      font-size: clamp(36px, 11vw, 52px); letter-spacing: .5px;
      animation: rise .6s ease-out both .1s;
    }
    .subtitle {
      margin: 4px 0 0;
      font-family: 'Nunito', -apple-system, system-ui, sans-serif; font-weight: 700;
      font-size: clamp(16px, 4.6vw, 21px);
      animation: rise .6s ease-out both .25s;
    }
    .bar {
      width: min(52vw, 220px); height: 6px; margin-top: 34px;
      border-radius: 999px; background: rgba(0,0,0,.18); overflow: hidden;
    }
    .bar::after {
      content: ""; display: block; height: 100%; width: 40%;
      border-radius: 999px; background: #ED8A0F;
      animation: load 1.1s ease-in-out infinite;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }
    @keyframes halo {
      0%, 100% { transform: scale(.9);  opacity: .6; }
      50%      { transform: scale(1.1); opacity: 1;  }
    }
    @keyframes rise {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: none;             opacity: 1; }
    }
    @keyframes load {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    /* Accesibilidad: sin animaciones si el usuario las desactivó. */
    @media (prefers-reduced-motion: reduce) {
      .logo, .logo-wrap::before, h1, .subtitle, .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Cargando Smart Parking">
    <div class="logo-wrap">
      <img class="logo" src="icons/splash-logo.png" alt="">
    </div>
    <h1>Smart Parking</h1>
    <p class="subtitle">Estacionamiento universitario</p>
    <div class="bar"></div>
  </div>
  <script>
    // ------------------------------------------------------------------
    // Cuadros por segundo ESTABLES a 60 fps.
    //
    // En pantallas de 120 Hz (ProMotion, p. ej. iPhone 17) el navegador pide
    // un cuadro cada 8 ms. Cuando un cuadro no alcanza a dibujarse en ese
    // tiempo, se salta y la animación "tirita". A 60 fps constantes cada
    // cuadro tiene 16 ms (el doble de margen) y el movimiento se ve suave y
    // uniforme, igual que en un iPhone de 60 Hz. En pantallas de 60 Hz esto
    // no cambia nada.
    //
    // Se hace envolviendo requestAnimationFrame ANTES de que cargue Flutter.
    // ------------------------------------------------------------------
    (function () {
      var nativeRaf = window.requestAnimationFrame.bind(window);
      var nativeCancel = window.cancelAnimationFrame.bind(window);
      var MIN_DELTA = 1000 / 60 - 2; // ~14.7 ms: tolera pequeñas variaciones
      var lastFrame = -1;            // marca del último cuadro ejecutado
      var nextId = 1;
      var pending = new Map();       // id propio → id nativo actual

      window.requestAnimationFrame = function (callback) {
        var id = nextId++;
        var tick = function (time) {
          // Se ejecuta si es el mismo cuadro que ya se aceptó (varias
          // llamadas en un cuadro) o si ya pasó el tiempo de un cuadro a 60 fps.
          if (time === lastFrame || time - lastFrame >= MIN_DELTA) {
            lastFrame = time;
            pending.delete(id);
            callback(time);
          } else {
            pending.set(id, nativeRaf(tick)); // espera al siguiente cuadro
          }
        };
        pending.set(id, nativeRaf(tick));
        return id;
      };

      window.cancelAnimationFrame = function (id) {
        var nativeId = pending.get(id);
        if (nativeId !== undefined) {
          nativeCancel(nativeId);
          pending.delete(id);
        }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
